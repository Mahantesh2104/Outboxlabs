services:
  # 1. Backend API + BullMQ Worker Service
  - type: web
    name: outbox-scheduler-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: outbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: outbox-redis
          property: port
      - key: WORKER_CONCURRENCY
        value: 5
      - key: RATE_LIMIT_MAX
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: MIN_SEND_DELAY_MS
        value: 500

  # 2. React Frontend Static Site
  - type: web
    name: outbox-scheduler-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://outbox-scheduler-backend.onrender.com/api

  # 3. Managed Redis Instance (BullMQ)
  - type: redis
    name: outbox-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

databases:
  # 4. Managed PostgreSQL Database
  - name: outbox-postgres
    databaseName: outbox_scheduler
    plan: free
